[alembic]
script_location = alembic
# The real URL is taken from the DATABASE_URL env var (see alembic/env.py);
# this value is only a fallback for local tooling.
sqlalchemy.url = postgresql://tournament_user:tournament_pass@localhost:5432/tournament_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
