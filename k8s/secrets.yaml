# Course/demo values. Change both before any real deployment, e.g.
#   SECRET_KEY: $(openssl rand -hex 32)
# POSTGRES_PASSWORD must match what the db StatefulSet initialised the volume
# with — changing it later requires deleting the PVC.
apiVersion: v1
kind: Secret
metadata:
  name: tournament-secrets
  namespace: tournament
type: Opaque
stringData:
  SECRET_KEY: "super-secret-key-change-in-production"
  POSTGRES_PASSWORD: "tournament_pass"
