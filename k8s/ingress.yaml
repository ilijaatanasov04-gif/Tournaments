apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tournament-ingress
  namespace: tournament
spec:
  ingressClassName: nginx
  rules:
    - host: tournament.local
      http:
        paths:
          # Everything goes to the frontend; its nginx serves the static build
          # and proxies /api/ to the backend Service. No rewrite annotation is
          # needed, so hashed asset URLs (/assets/*.js) stay intact.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
